# cargo-deny policy (`cargo deny check`), enforced by .github/workflows/supply-chain.yml.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The shipped binaries target Windows; the Linux and macOS graphs are also checked because the CLI,
# tests and CI run there.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Vulnerabilities, unsound and yanked crates fail the check anywhere in the graph unless they are
# listed in `ignore` with the reason they do not affect Symphony and when to remove the entry.
# "Unmaintained" notices fail only for direct dependencies of the workspace: transitive ones (today
# zbus/zvariant, anymap2 and proc-macro-error under Tauri/GTK, unsafe-libyaml under serde_yaml) have
# no maintained replacement we control and are tracked through Dependabot instead.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # glib 0.18 VariantStrIter unsoundness: only in Tauri's Linux GTK stack (gtk 0.18 is pinned by
    # Tauri 2), absent from the shipped Windows build; Symphony never uses VariantStrIter. Remove
    # when Tauri moves to gtk-rs >= 0.20.
    { id = "RUSTSEC-2024-0429", reason = "Linux-only Tauri GTK dependency; VariantStrIter unused" },
]

[licenses]
# Permissive licenses compatible with distributing the MIT-licensed binaries. MPL-2.0 is file-level
# copyleft (unmodified upstream sources only). Anything else needs a deliberate review.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Tauri's dependency tree necessarily carries several majors of windows-sys, toml, etc.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
