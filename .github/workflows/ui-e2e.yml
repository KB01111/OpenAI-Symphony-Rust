name: Desktop UI E2E (Playwright)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Playwright against real runtime (simulated agent)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ui-e2e
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build runtime CLI
        run: cargo build -p symphony-cli --locked
      - name: API client integration tests (real Axum router)
        run: pnpm --filter @symphony/api-client test
      - name: Install Chromium
        run: pnpm --filter @symphony/desktop exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm --filter @symphony/desktop e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots
          path: docs/screenshots/
          retention-days: 14
