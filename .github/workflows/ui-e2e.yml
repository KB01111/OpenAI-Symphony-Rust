name: Desktop UI E2E (Playwright)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Playwright against real runtime (simulated agent)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ui-e2e
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build runtime CLI
        run: cargo build -p symphony-cli --locked
      - name: API client integration tests (real Axum router)
        run: pnpm --filter @symphony/api-client test
      - name: Install Chromium
        run: pnpm --filter @symphony/desktop exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm --filter @symphony/desktop e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: docs/screenshots/
          retention-days: 14
