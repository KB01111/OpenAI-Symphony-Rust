name: API contract

# The Rust handlers are the source of truth for the HTTP API. This workflow proves that:
#   1. the committed OpenAPI document, task state machine and Hey API client are regenerated
#      from the current Rust code (`pnpm generate:api` leaves no diff), and
#   2. the API versioning policy holds against the base branch (scripts/api-contract-policy.mjs):
#      a breaking OpenAPI change needs BOTH the `api-breaking-change` label AND an `API_VERSION`
#      above the base branch's; `API_VERSION` never decreases; non-breaking changes need neither.

on:
  pull_request:
    branches: [main]
    # Re-evaluate when the `api-breaking-change` label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# Label events run in their own group: adding or removing `api-breaking-change` must never cancel
# the code-triggered run (which also checks the generated contracts), and a push must not cancel
# the policy re-evaluation of a label change. Within each group the newest run wins.
concurrency:
  group: api-contract-${{ github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'code' }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OASDIFF_VERSION: 1.34.0
  # sha256 of oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz from the release's checksums.txt.
  OASDIFF_SHA256: 7c88e09fd500b231af2819eb21f6fdfc7bcdfe2741d2c1937c59e7b72c8a575a

jobs:
  generated:
    name: Generated contracts are up to date
    # A label change cannot change the generated artifacts.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: api-contract
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract invariants (operation ids, auth, required fields, path parameters)
        run: cargo test -p symphony-server --test openapi_contract --test state_machine_contract --locked
      - name: Versioning policy tests (invalid breaking-change scenarios are rejected)
        run: pnpm test:scripts
      - name: Regenerate OpenAPI document, state machine and Hey API client
        run: pnpm generate:api
      - name: Fail on uncommitted generated changes
        run: |
          git add -N openapi packages/shared-types/src/generated
          if ! git diff --exit-code -- openapi packages/shared-types/src/generated; then
            echo "::error::Generated API contracts are stale. Run 'pnpm generate:api' and commit the result."
            exit 1
          fi
      - name: Regeneration is deterministic (second run leaves no diff)
        run: |
          pnpm generate:api
          git add -N openapi packages/shared-types/src/generated
          git diff --exit-code -- openapi packages/shared-types/src/generated

  breaking:
    name: API versioning policy
    # Re-run on label changes only for the label the policy reads.
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'api-breaking-change')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}
          path: base
          sparse-checkout: |
            openapi
            crates/symphony-server/src/lib.rs
            scripts/api-contract-policy.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install oasdiff (pinned, checksum verified)
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${archive}"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
      - name: Detect breaking changes against the base branch
        run: |
          base="base/openapi/symphony-api.json"
          head="head/openapi/symphony-api.json"
          if [ ! -f "$base" ]; then
            echo "[]" > "$RUNNER_TEMP/breaking.json"
            echo "The base branch has no OpenAPI document yet; nothing to compare."
            exit 0
          fi
          # The head document is pull-request controlled: never follow external $refs (SSRF).
          "$RUNNER_TEMP/oasdiff" changelog "$base" "$head" --allow-external-refs=false --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          # A failure here (e.g. an unparsable document) fails the job; it is never read as "no changes".
          "$RUNNER_TEMP/oasdiff" breaking "$base" "$head" --allow-external-refs=false --format json > "$RUNNER_TEMP/breaking.json"
          "$RUNNER_TEMP/oasdiff" breaking "$base" "$head" --allow-external-refs=false || true
      - name: Enforce label + API_VERSION bump for breaking changes
        env:
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-change') }}
        run: |
          # Prefer the base branch's copy of the policy so a pull request cannot relax its own check.
          policy="base/scripts/api-contract-policy.mjs"
          [ -f "$policy" ] || policy="head/scripts/api-contract-policy.mjs"
          node "$policy" \
            --changes "$RUNNER_TEMP/breaking.json" \
            --base-source base/crates/symphony-server/src/lib.rs \
            --head-source head/crates/symphony-server/src/lib.rs \
            --labelled "$LABELLED"
