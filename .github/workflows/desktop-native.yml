name: Desktop native build (Windows)

# Separate from ci.yml (owned by the CI-repair PR) so both can evolve independently.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tauri-windows:
    name: Tauri 2 build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: desktop-native

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API contract invariants (OpenAPI document and task state machine)
        run: cargo test -p symphony-server --test openapi_contract --test state_machine_contract --locked

      # Unsigned NSIS installer for release verification only. No signing secrets are used; the
      # artifact name says UNSIGNED and it must not be distributed as a production build.
      - name: Build desktop app (frontend + Tauri host, release, unsigned NSIS installer)
        run: pnpm --filter @symphony/desktop tauri build --bundles nsis

      - name: Build the CLI (release)
        run: cargo build -p symphony-cli --release --locked

      - name: Smoke-check the native binary exists
        shell: pwsh
        run: |
          $exe = "target/release/symphony-desktop.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      # Runs the real release binaries: runtime start, owner-only DACLs in a world-writable data
      # directory, authenticated API, DPAPI vault persistence across restart, single scheduler
      # (CLI + second desktop instance), crash recovery without orphans, and attach mode.
      - name: Native Windows runtime smoke test
        shell: pwsh
        run: pwsh -NoProfile -File scripts/windows-native-smoke.ps1 -DesktopExe target/release/symphony-desktop.exe -CliExe target/release/symphony-cli.exe

      - name: Upload native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symphony-desktop-windows
          path: target/release/symphony-desktop.exe
          retention-days: 7

      - name: Upload unsigned installer (verification only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symphony-desktop-windows-installer-UNSIGNED
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
