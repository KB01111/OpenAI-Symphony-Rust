name: Desktop native build (Windows)

# Separate from ci.yml (owned by the CI-repair PR) so both can evolve independently.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tauri-windows:
    name: Tauri 2 build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: desktop-native

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API contract invariants (OpenAPI document and task state machine)
        run: cargo test -p symphony-server --test openapi_contract --test state_machine_contract --locked

      - name: Build desktop app (frontend + Tauri host, release, no installer)
        run: pnpm --filter @symphony/desktop tauri build --no-bundle

      - name: Smoke-check the native binary exists
        shell: pwsh
        run: |
          $exe = "target/release/symphony-desktop.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: Upload native binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symphony-desktop-windows
          path: target/release/symphony-desktop.exe
          retention-days: 7
