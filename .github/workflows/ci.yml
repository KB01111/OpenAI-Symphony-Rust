name: Symphony Desktop CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref so PR feedback always reflects HEAD.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-verify:
    name: Windows 11 (Rust + Desktop + Mobile Web)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-verify

      # pnpm is pinned by the "packageManager" field in the root package.json
      # (pnpm@11.15.1). Do not pass "version" here: duplicating the version in
      # the workflow is what made CI fail with "Multiple versions of pnpm
      # specified" (action pin 10 vs packageManager 11.x).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Print toolchain versions
        shell: pwsh
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      # --frozen-lockfile makes dependency resolution reproducible: the build
      # must match the committed pnpm-lock.yaml exactly.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace compilation
        run: cargo check --workspace --locked

      - name: Run Clippy (all targets, including tests)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the Windows-only native tests (owner-only DACLs, DPAPI vault, HKCU autostart:
      # crates/symphony-platform/tests/windows_native.rs) and the CLI runtime lifecycle test.
      - name: Run Rust workspace unit & E2E tests
        run: cargo test --workspace --locked

      - name: Run Frontend TypeScript typecheck
        run: pnpm typecheck

      - name: Run Frontend Vitest suites
        run: pnpm test

      - name: Build Desktop and Mobile production bundles
        run: pnpm build

  macos-ios-companion:
    name: macOS (iOS Companion Validation)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same source of truth as the Windows job: the root package.json
      # "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Print toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared, UI and companion packages
        run: |
          pnpm --filter @symphony/shared-types typecheck
          pnpm --filter @symphony/api-client typecheck
          pnpm --filter @symphony/ui typecheck
          pnpm --filter @symphony/mobile typecheck

      - name: Build iOS companion bundle
        run: pnpm --filter @symphony/mobile build
