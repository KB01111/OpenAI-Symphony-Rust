[package]
name = "symphony-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
symphony-core = { path = "../../../crates/symphony-core" }
symphony-storage = { path = "../../../crates/symphony-storage" }
symphony-workspaces = { path = "../../../crates/symphony-workspaces" }
symphony-orchestrator = { path = "../../../crates/symphony-orchestrator" }
symphony-server = { path = "../../../crates/symphony-server" }
symphony-platform = { path = "../../../crates/symphony-platform" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# No `zip` feature: it only unpacks macOS/Linux update bundles (we ship an NSIS installer) and drags in a `zip`
# release with open advisories (RUSTSEC-2026-0367..0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
reqwest.workspace = true
semver = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
